<svg viewBox="0 0 1000 238" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stack — languages, mobile, web, backend, data, tooling, systems">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(6px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.3s} .a4{animation-delay:.4s} .a5{animation-delay:.5s} .a6{animation-delay:.6s} .a7{animation-delay:.7s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
    /*@THEME@*/
  </style>

  <line x1="138" y1="8" x2="138" y2="230" stroke="var(--rule)" stroke-width="1" opacity=".4"/>

  <text class="mono rise a1" x="48" y="32"  font-size="12" fill="var(--muted)" letter-spacing="2">LANGUAGES</text>
  <text class="mono rise a1" x="154" y="32"  font-size="15" fill="var(--bone)">TypeScript &#183; Go &#183; Dart &#183; Python &#183; C &#183; PHP</text>

  <text class="mono rise a2" x="48" y="64"  font-size="12" fill="var(--muted)" letter-spacing="2">MOBILE</text>
  <text class="mono rise a2" x="154" y="64"  font-size="15" fill="var(--bone)">Flutter &#183; Dart &#183; Provider / Riverpod &#183; Firebase</text>

  <text class="mono rise a3" x="48" y="96"  font-size="12" fill="var(--muted)" letter-spacing="2">WEB</text>
  <text class="mono rise a3" x="154" y="96"  font-size="15" fill="var(--bone)">Astro &#183; Next.js &#183; React &#183; Tailwind &#183; Sanity &#183; Strapi</text>

  <text class="mono rise a4" x="48" y="128" font-size="12" fill="var(--muted)" letter-spacing="2">SERVICES</text>
  <text class="mono rise a4" x="154" y="128" font-size="15" fill="var(--bone)">Go &#183; Hono &#183; Node.js &#183; Express &#183; REST APIs &#183; JWT auth</text>

  <text class="mono rise a5" x="48" y="160" font-size="12" fill="var(--muted)" letter-spacing="2">DATA</text>
  <text class="mono rise a5" x="154" y="160" font-size="15" fill="var(--bone)">PostgreSQL &#183; PL/pgSQL &#183; MySQL &#183; MongoDB &#183; Prisma &#183; Supabase</text>

  <text class="mono rise a6" x="48" y="192" font-size="12" fill="var(--muted)" letter-spacing="2">TOOLING</text>
  <text class="mono rise a6" x="154" y="192" font-size="15" fill="var(--bone)">Cobra CLIs &#183; GoReleaser &#183; Homebrew taps &#183; Docker &#183; Figma &#183; Postman</text>

  <text class="mono rise a7" x="48" y="224" font-size="12" fill="var(--muted)" letter-spacing="2">SYSTEMS</text>
  <text class="mono rise a7" x="154" y="224" font-size="15" fill="var(--bone)">C &#183; systemd &#183; Docker Compose &#183; shell scripting &#183; Linux &#183; networking</text>
</svg>
