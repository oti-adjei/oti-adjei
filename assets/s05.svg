<svg viewBox="0 0 1000 92" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Section 05 — TELEMETRY">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 760; stroke-dashoffset: 760; animation: d 1.3s cubic-bezier(.6,0,.2,1) .2s forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    .f { opacity: 0; animation: f .8s ease .1s forwards; }
    @keyframes f { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .draw,.f { animation: none; } .draw { stroke-dashoffset: 0; } .f { opacity: 1; }
    }
    :root { --bone:#0A0A0A; --muted:#6E6E6E; --dim:#9A9A9A; --rule:#D8D8D8; --accent:#0A0A0A; --ghost:#EBEBEB; --node-bg:#FFFFFF; --core-bg:#F4F4F4; --ink:#0A0A0A; --paper:#FFFFFF; }
  </style>
  <g class="f">
    <text class="mono" x="48" y="68" font-size="52" fill="var(--ghost)">05</text>
    <text class="mono" x="128" y="58" font-size="14" fill="var(--accent)" letter-spacing="6">TELEMETRY</text>
    <text class="mono" x="952" y="58" font-size="11" fill="var(--muted)" letter-spacing="2" text-anchor="end">~/05-telemetry</text>
  </g>
  <line class="draw" x1="285" y1="53" x2="831" y2="53"/>
</svg>
