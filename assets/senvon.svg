<svg viewBox="0 0 1000 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Senvon Atelier — digital studio in Accra, established 2025">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .draw { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: d 1.5s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    .a1{animation-delay:.1s} .a2{animation-delay:.3s} .a3{animation-delay:.5s} .a4{animation-delay:.7s}
    @media (prefers-reduced-motion: reduce) { .rise{animation:none;opacity:1} .draw{animation:none;stroke-dashoffset:0} }
    :root { --bone:#0A0A0A; --muted:#6E6E6E; --dim:#9A9A9A; --rule:#D8D8D8; --accent:#0A0A0A; --ghost:#EBEBEB; --node-bg:#FFFFFF; --core-bg:#F4F4F4; --ink:#0A0A0A; --paper:#FFFFFF; }
  </style>

  <g class="rise a1">
    <text class="mono" fill="var(--muted)" x="48" y="24" font-size="10" letter-spacing="3.5">DIGITAL STUDIO &#8212; ACCRA, GH</text>
    <text class="mono" fill="var(--muted)" x="952" y="24" font-size="10" letter-spacing="3.5" text-anchor="end">EST. 2025</text>
  </g>
  <line class="draw" x1="48" y1="38" x2="952" y2="38"/>

  <g class="rise a2">
    <text class="mono" fill="var(--bone)" x="46" y="88" font-size="38" letter-spacing="-1">Senvon Atelier</text>
    <text class="mono" fill="var(--accent)" x="952" y="88" font-size="14" letter-spacing="1" text-anchor="end">senvon.studio</text>
  </g>

  <g class="rise a3">
    <text class="mono" fill="var(--muted)" x="48" y="120" font-size="14">storefronts, admin portals and the backends underneath them &#8212; designed, built and shipped in house.</text>
  </g>

  <line class="rise a3" x1="48" y1="144" x2="952" y2="144" stroke="var(--rule)" stroke-width="1" opacity=".5"/>

  <g class="rise a4">
    <text class="mono" fill="var(--muted)" x="48"  y="172" font-size="10" letter-spacing="2.5">BUILDS</text>
    <text class="mono" fill="var(--bone)" x="140" y="172" font-size="13">HomeSweetHome &#183; Nagyique Boutique &#183; Senvon Commerce</text>
    <text class="mono" fill="var(--muted)" x="48"  y="194" font-size="10" letter-spacing="2.5">CLIENTS</text>
    <text class="mono" fill="var(--bone)" x="140" y="194" font-size="13">Gullivers &#183; Royal Park &#183; Mummys Darl &#183; Lobab Kids &#183; Lue Cosmetics</text>
  </g>
</svg>
