<svg viewBox="0 0 1000 236" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami — bio, focus, status, off the clock">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.35s} .a4{animation-delay:.5s} .a5{animation-delay:.65s} .a6{animation-delay:.8s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
    :root { --bone:#EDEDED; --muted:#8B949E; --dim:#5E656D; --rule:#30363D; --accent:#EDEDED; --ghost:#1B1F24; --node-bg:#0D1117; --core-bg:#161B22; --ink:#EDEDED; --paper:#0D1117; }
  </style>

  <text class="mono rise a1" x="48" y="32" font-size="16" fill="var(--bone)">software engineer in Accra, Ghana — building mobile and web applications.</text>
  <text class="mono rise a2" x="48" y="60" font-size="16" fill="var(--bone)">shipping across the stack — Flutter &#183; TypeScript &#183; Next.js &#183; Node.js &#183; Go &#183; CLI tooling.</text>
  <text class="mono rise a3" x="48" y="88" font-size="15" fill="var(--muted)">came up through C and low-level systems work. still reach for the terminal first.</text>

  <line class="rise a4" x1="48" y1="116" x2="952" y2="116" stroke="var(--rule)" stroke-width="1" opacity=".5"/>

  <text class="mono rise a4" x="48"  y="148" font-size="11" fill="var(--muted)" letter-spacing="2.5">FOCUS</text>
  <text class="mono rise a4" x="154" y="148" font-size="15" fill="var(--bone)">Mobile &amp; Flutter &#183; Product Web &#183; Backend APIs &#183; Developer Tooling</text>

  <text class="mono rise a5" x="48"  y="182" font-size="11" fill="var(--muted)" letter-spacing="2.5">STATUS</text>
  <text class="mono rise a5" x="154" y="182" font-size="15" fill="var(--accent)">building in public &#183; streaming on Twitch &#183; open to collaboration</text>

  <text class="mono rise a6" x="48"  y="216" font-size="11" fill="var(--muted)" letter-spacing="2.5">OFF CLOCK</text>
  <text class="mono rise a6" x="154" y="216" font-size="15" fill="var(--bone)">video games, tech reading, and making open source less intimidating</text>
</svg>
