<svg viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline: 2019 first repository, 2021 university projects, 2022 Flutter final year project, 2023 ALX software engineering, 2024 mobile and API work, 2025 client product work, now developer tooling">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .axis { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 1110; stroke-dashoffset: 1110; animation: draw 2.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .m { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .m1{animation-delay:.4s}.m2{animation-delay:.8s}.m3{animation-delay:1.1s}.m4{animation-delay:1.4s}.m5{animation-delay:1.7s}.m6{animation-delay:2.0s}.m7{animation-delay:2.3s}.m8{animation-delay:2.6s}
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .ring { animation: ring 2.6s ease-out infinite; transform-origin: 1060px 125px; }
    @keyframes ring { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(3);opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .axis,.m,.pulse,.ring { animation: none; } .axis{stroke-dashoffset:0} .m{opacity:1} .ring{opacity:0}
    }
    :root { --bone:#EDEDED; --muted:#8B949E; --dim:#5E656D; --rule:#30363D; --accent:#EDEDED; --ghost:#1B1F24; --node-bg:#0D1117; --core-bg:#161B22; --ink:#EDEDED; --paper:#0D1117; }
  </style>

  <line x1="48" y1="40" x2="1152" y2="40" stroke="var(--rule)"/>
  <text fill="var(--muted)" class="mono" x="48" y="28" font-size="11" letter-spacing="3.5">THE ROUTE SO FAR</text>
  <text fill="var(--muted)" class="mono" x="1152" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 03</text>

  <line class="axis" x1="48" y1="125" x2="1158" y2="125"/>

  <g class="m m1">
    <circle cx="100" cy="125" r="4" fill="var(--bone)"/>
    <line x1="100" y1="121" x2="100" y2="96" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="100" y="74" font-size="11" letter-spacing="2" text-anchor="middle">2019</text>
    <text fill="var(--bone)" class="mono" x="100" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">first repository</text>
  </g>

  <g class="m m2">
    <circle cx="265" cy="125" r="4" fill="var(--bone)"/>
    <line x1="265" y1="129" x2="265" y2="154" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="265" y="172" font-size="11" letter-spacing="2" text-anchor="middle">2021</text>
    <text fill="var(--bone)" class="mono" x="265" y="188" font-size="10.5" letter-spacing="1" text-anchor="middle">first Flutter builds &#183; uni projects</text>
  </g>

  <g class="m m3">
    <circle cx="430" cy="125" r="4" fill="var(--bone)"/>
    <line x1="430" y1="121" x2="430" y2="96" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="430" y="74" font-size="11" letter-spacing="2" text-anchor="middle">2022</text>
    <text fill="var(--bone)" class="mono" x="430" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">CovidApp &#183; BloodSpot &#8212; final year</text>
  </g>

  <g class="m m4">
    <circle cx="595" cy="125" r="4" fill="var(--bone)"/>
    <line x1="595" y1="129" x2="595" y2="154" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="595" y="172" font-size="11" letter-spacing="2" text-anchor="middle">2023</text>
    <text fill="var(--bone)" class="mono" x="595" y="188" font-size="10.5" letter-spacing="1" text-anchor="middle">ALX SE &#8212; C, Python, systems</text>
  </g>

  <g class="m m5">
    <circle cx="760" cy="125" r="4" fill="var(--bone)"/>
    <line x1="760" y1="121" x2="760" y2="96" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="760" y="74" font-size="11" letter-spacing="2" text-anchor="middle">2024</text>
    <text fill="var(--bone)" class="mono" x="760" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">Loanify &#8212; Flutter client + TS backend</text>
  </g>

  <g class="m m6">
    <circle cx="925" cy="125" r="4" fill="var(--bone)"/>
    <line x1="925" y1="129" x2="925" y2="154" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="925" y="172" font-size="11" letter-spacing="2" text-anchor="middle">2025</text>
    <text fill="var(--bone)" class="mono" x="925" y="188" font-size="10.5" letter-spacing="1" text-anchor="middle">client product work &#183; APIs &#183; Arkyt</text>
  </g>

  <g class="m m7">
    <circle class="ring" cx="1060" cy="125" r="4" stroke="var(--accent)" fill="none"/>
    <circle class="pulse" cx="1060" cy="125" r="4.5" fill="var(--accent)"/>
    <line x1="1060" y1="121" x2="1060" y2="96" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="1060" y="74" font-size="11" letter-spacing="2" text-anchor="middle">NOW</text>
    <text fill="var(--bone)" class="mono" x="1060" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">dev tooling &#183; building in public</text>
  </g>

  <g class="m m8">
    <circle cx="1152" cy="125" r="3" fill="var(--dim)"/>
    <text fill="var(--dim)" class="mono" x="1152" y="150" font-size="10" letter-spacing="2" text-anchor="end">2027 &#8594;</text>
    <text fill="var(--dim)" class="mono" x="1152" y="172" font-size="13" text-anchor="end">the interesting part</text>
  </g>
</svg>
