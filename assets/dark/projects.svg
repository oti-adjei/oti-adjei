<svg viewBox="0 0 1000 586" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Six selected projects by George Heavenson, with four more listed by name">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; }
    .row { opacity:0; animation:reveal .55s cubic-bezier(.2,.7,.2,1) forwards; }
    .rule { stroke:var(--rule); stroke-width:1; }
    .grule { stroke:var(--rule); stroke-width:1; opacity:.5; }
    .glabel { fill:var(--accent); font-size:11px; letter-spacing:3.5px; }
    .ghead { opacity:0; animation:reveal .6s ease forwards; }
    .title { fill:var(--ink); font-size:17px; font-weight:700; letter-spacing:.8px; }
    .copy { fill:var(--muted); font-size:12px; }
    .meta { fill:var(--dim); font-size:11px; letter-spacing:.4px; }
    .more { fill:var(--muted); font-size:12px; letter-spacing:1.2px; }
    .note { fill:var(--dim); font-size:11px; letter-spacing:.4px; }
    @keyframes reveal { from { opacity:0; } to { opacity:1; } }
    .r1{animation-delay:.05s}.r2{animation-delay:.10s}.r3{animation-delay:.15s}
    .r4{animation-delay:.20s}.r5{animation-delay:.25s}.r6{animation-delay:.30s}.r7{animation-delay:.35s}
    @media (prefers-reduced-motion:reduce) { .row,.ghead { animation:none; opacity:1; } }
    :root { --bone:#EDEDED; --muted:#8B949E; --dim:#5E656D; --rule:#30363D; --accent:#EDEDED; --ghost:#1B1F24; --node-bg:#0D1117; --core-bg:#161B22; --ink:#EDEDED; --paper:#0D1117; }
  </style>

  <g class="mono">
    <g class="ghead"><text class="glabel" x="48" y="38">SELECTED WORK</text><line class="grule" x1="48" y1="50" x2="952" y2="50"/></g>

    <g class="row r1" transform="translate(0 64)">
      <text class="title" x="48" y="24">01 / SIGNAL</text>
      <text class="copy" x="48" y="50">Esports news and tournament platform, in active</text>
      <text class="copy" x="48" y="68">development.</text>
      <text class="meta" x="48" y="92">TYPESCRIPT &#183; WEB &#183; IN DEVELOPMENT</text>
      <line class="rule" x1="48" y1="108" x2="484" y2="108"/>
    </g>
    <g class="row r2" transform="translate(0 64)">
      <text class="title" x="516" y="24">02 / NAGYIQUE BOUTIQUE</text>
      <text class="copy" x="516" y="50">Boutique e-commerce: Astro storefront, admin portal and a</text>
      <text class="copy" x="516" y="68">TypeScript API on Workers, with Stripe and Square.</text>
      <text class="meta" x="516" y="92">ASTRO &#183; TYPESCRIPT &#183; STRIPE &#183; WORKERS &#183; SENVON</text>
      <line class="rule" x1="516" y1="108" x2="952" y2="108"/>
    </g>
    <g class="row r3" transform="translate(0 196)">
      <text class="title" x="48" y="24">03 / ZOOK</text>
      <text class="copy" x="48" y="50">Tiny deploy controller for Docker Compose and native</text>
      <text class="copy" x="48" y="68">systemd apps. Ships through its own Homebrew tap.</text>
      <text class="meta" x="48" y="92">GO &#183; DOCKER &#183; SYSTEMD &#183; HOMEBREW</text>
      <line class="rule" x1="48" y1="108" x2="484" y2="108"/>
    </g>
    <g class="row r4" transform="translate(0 196)">
      <text class="title" x="516" y="24">04 / MOTE</text>
      <text class="copy" x="516" y="50">Deterministic animated background fields &#8212; designed</text>
      <text class="copy" x="516" y="68">shape sets, not generic particles.</text>
      <text class="meta" x="516" y="92">TYPESCRIPT &#183; CANVAS &#183; OPEN SOURCE</text>
      <line class="rule" x1="516" y1="108" x2="952" y2="108"/>
    </g>
    <g class="row r5" transform="translate(0 328)">
      <text class="title" x="48" y="24">05 / WOLEVO</text>
      <text class="copy" x="48" y="50">Flutter client for a shop-and-ship service delivering</text>
      <text class="copy" x="48" y="68">from US stores to Ghana and Nigeria.</text>
      <text class="meta" x="48" y="92">FLUTTER &#183; DART &#183; MOBILE</text>
      <line class="rule" x1="48" y1="108" x2="484" y2="108"/>
    </g>
    <g class="row r6" transform="translate(0 328)">
      <text class="title" x="516" y="24">06 / GULLIVERS TRAVEL HOTEL</text>
      <text class="copy" x="516" y="50">Hotel site with amenities, services and booking. Shipped</text>
      <text class="copy" x="516" y="68">once, then rebuilt in React on Cloudflare Pages.</text>
      <text class="meta" x="516" y="92">REACT &#183; CLOUDFLARE PAGES &#183; D1 &#183; SENVON</text>
      <line class="rule" x1="516" y1="108" x2="952" y2="108"/>
    </g>

    <g class="row r7" transform="translate(0 472)">
      <text class="glabel" x="48" y="14">ALSO</text>
      <line class="grule" x1="48" y1="26" x2="952" y2="26"/>
      <text class="more" x="48" y="54">GATORAID &#183; CHRYSALIS BLUEPRINT &#183; MOBA17 &#183; LUE COSMETICS</text>
      <text class="note" x="952" y="54" text-anchor="end">github.com/oti-adjei?tab=repositories</text>
    </g>
  </g>
</svg>
