<svg viewBox="0 0 1000 310" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub statistics and languages by repository count">
  <style>
    .mono { font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace; fill:var(--ink); }
    .panel { fill:none; stroke:var(--rule); stroke-width:1; }
    .rule { stroke:var(--rule); stroke-width:1; }
    .bar { fill:none; stroke:var(--rule); stroke-width:1; }
    .fill { fill:var(--accent); }
    .lbl { fill:var(--muted); }
    .grow { transform:scaleX(0); transform-origin:left; animation:grow .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .g2{animation-delay:.1s}.g3{animation-delay:.2s}.g4{animation-delay:.3s}.g5{animation-delay:.4s}
    @keyframes grow { to { transform:scaleX(1); } }
    @media (prefers-reduced-motion:reduce) { .grow { animation:none; transform:scaleX(1); } }
    :root { --bone:#0A0A0A; --muted:#6E6E6E; --dim:#9A9A9A; --rule:#D8D8D8; --accent:#0A0A0A; --ghost:#EBEBEB; --node-bg:#FFFFFF; --core-bg:#F4F4F4; --ink:#0A0A0A; --paper:#FFFFFF; }
  </style>
  <rect class="panel" x="24" y="20" width="456" height="270" rx="2"/>
  <rect class="panel" x="520" y="20" width="456" height="270" rx="2"/>

  <g class="mono">
    <text x="52" y="58" font-size="15" font-weight="700" letter-spacing="2">GITHUB STATS</text>
    <line class="rule" x1="52" y1="72" x2="452" y2="72"/>
    <text class="lbl" x="52" y="110" font-size="11" letter-spacing="1">PUBLIC REPOSITORIES</text><text x="436" y="110" font-size="13" text-anchor="end">59</text>
    <text class="lbl" x="52" y="146" font-size="11" letter-spacing="1">SENVON ATELIER REPOS</text><text x="436" y="146" font-size="13" text-anchor="end">18</text>
    <text class="lbl" x="52" y="182" font-size="11" letter-spacing="1">FOLLOWERS</text><text x="436" y="182" font-size="13" text-anchor="end">26</text>
    <text class="lbl" x="52" y="218" font-size="11" letter-spacing="1">GO CODEBASES</text><text x="436" y="218" font-size="13" text-anchor="end">5</text>
    <text class="lbl" x="52" y="254" font-size="11" letter-spacing="1">YEARS ACTIVE &#183; SINCE 2019</text><text x="436" y="254" font-size="13" text-anchor="end">7</text>

    <text x="548" y="58" font-size="15" font-weight="700" letter-spacing="2">LANGUAGES BY REPOSITORY</text>
    <line class="rule" x1="548" y1="72" x2="948" y2="72"/>
    <text class="lbl" x="548" y="105" font-size="10">TYPESCRIPT</text><rect class="bar" x="660" y="94"  width="270" height="12"/><rect class="fill grow"    x="660" y="94"  width="250" height="12"/>
    <text class="lbl" x="548" y="141" font-size="10">DART</text>      <rect class="bar" x="660" y="130" width="270" height="12"/><rect class="fill grow g2" x="660" y="130" width="63" height="12"/>
    <text class="lbl" x="548" y="177" font-size="10">C</text>         <rect class="bar" x="660" y="166" width="270" height="12"/><rect class="fill grow g3" x="660" y="166" width="63" height="12"/>
    <text class="lbl" x="548" y="213" font-size="10">GO</text>    <rect class="bar" x="660" y="202" width="270" height="12"/><rect class="fill grow g4" x="660" y="202" width="50"  height="12"/>
    <text class="lbl" x="548" y="249" font-size="10">PYTHON</text>     <rect class="bar" x="660" y="238" width="270" height="12"/><rect class="fill grow g5" x="660" y="238" width="38"  height="12"/>
  </g>
</svg>
