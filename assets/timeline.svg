<svg viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline: 2019 first repository, 2021 first Flutter builds, 2022 final year projects, 2023 ALX software engineering, 2024 Loanify, 2025 Senvon Atelier founded, 2026 HomeSweetHome and Nagyique, now running the studio">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .axis { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 1110; stroke-dashoffset: 1110; animation: draw 2.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .m { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .m1{animation-delay:.4s}.m2{animation-delay:.8s}.m3{animation-delay:1.1s}.m4{animation-delay:1.4s}.m5{animation-delay:1.7s}.m6{animation-delay:2.0s}.m7{animation-delay:2.3s}.m8{animation-delay:2.6s}
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .ring { animation: ring 2.6s ease-out infinite; transform-origin: 1010px 125px; }
    @keyframes ring { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(3);opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .axis,.m,.pulse,.ring { animation: none; } .axis{stroke-dashoffset:0} .m{opacity:1} .ring{opacity:0}
    }
    :root { --bone:#0A0A0A; --muted:#6E6E6E; --dim:#9A9A9A; --rule:#D8D8D8; --accent:#0A0A0A; --ghost:#EBEBEB; --node-bg:#FFFFFF; --core-bg:#F4F4F4; --ink:#0A0A0A; --paper:#FFFFFF; }
  </style>

  <line x1="48" y1="40" x2="1152" y2="40" stroke="var(--rule)"/>
  <text fill="var(--muted)" class="mono" x="48" y="28" font-size="11" letter-spacing="3.5">THE ROUTE SO FAR</text>
  <text fill="var(--muted)" class="mono" x="1152" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 03</text>

  <line class="axis" x1="48" y1="125" x2="1158" y2="125"/>

  <g class="m m1">
    <circle cx="100" cy="125" r="4" fill="var(--bone)"/>
    <line x1="100" y1="121" x2="100" y2="96" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="100" y="74" font-size="11" letter-spacing="2" text-anchor="middle">2019</text>
    <text fill="var(--bone)" class="mono" x="100" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">first repository</text>
  </g>

  <g class="m m2">
    <circle cx="230" cy="125" r="4" fill="var(--bone)"/>
    <line x1="230" y1="129" x2="230" y2="154" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="230" y="172" font-size="11" letter-spacing="2" text-anchor="middle">2021</text>
    <text fill="var(--bone)" class="mono" x="230" y="188" font-size="10.5" letter-spacing="1" text-anchor="middle">first Flutter builds</text>
  </g>

  <g class="m m3">
    <circle cx="360" cy="125" r="4" fill="var(--bone)"/>
    <line x1="360" y1="121" x2="360" y2="96" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="360" y="74" font-size="11" letter-spacing="2" text-anchor="middle">2022</text>
    <text fill="var(--bone)" class="mono" x="360" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">CovidApp &#183; BloodSpot</text>
  </g>

  <g class="m m4">
    <circle cx="490" cy="125" r="4" fill="var(--bone)"/>
    <line x1="490" y1="129" x2="490" y2="154" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="490" y="172" font-size="11" letter-spacing="2" text-anchor="middle">2023</text>
    <text fill="var(--bone)" class="mono" x="490" y="188" font-size="10.5" letter-spacing="1" text-anchor="middle">ALX SE &#8212; C, Python, systems</text>
  </g>

  <g class="m m5">
    <circle cx="620" cy="125" r="4" fill="var(--bone)"/>
    <line x1="620" y1="121" x2="620" y2="96" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="620" y="74" font-size="11" letter-spacing="2" text-anchor="middle">2024</text>
    <text fill="var(--bone)" class="mono" x="620" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">Loanify &#8212; Flutter + TS</text>
  </g>

  <g class="m m6">
    <circle cx="750" cy="125" r="4" fill="var(--bone)"/>
    <line x1="750" y1="129" x2="750" y2="154" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="750" y="172" font-size="11" letter-spacing="2" text-anchor="middle">2025</text>
    <text fill="var(--bone)" class="mono" x="750" y="188" font-size="10.5" letter-spacing="1" text-anchor="middle">Senvon Atelier founded</text>
  </g>

  <g class="m m7">
    <circle cx="880" cy="125" r="4" fill="var(--bone)"/>
    <line x1="880" y1="121" x2="880" y2="96" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="880" y="74" font-size="11" letter-spacing="2" text-anchor="middle">2026</text>
    <text fill="var(--bone)" class="mono" x="880" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">HomeSweetHome &#183; Nagyique</text>
  </g>

  <g class="m m8">
    <circle class="ring" cx="1010" cy="125" r="4" stroke="var(--accent)" fill="none"/>
    <circle class="pulse" cx="1010" cy="125" r="4.5" fill="var(--accent)"/>
    <line x1="1010" y1="129" x2="1010" y2="154" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="1010" y="172" font-size="11" letter-spacing="2" text-anchor="middle">NOW</text>
    <text fill="var(--bone)" class="mono" x="1010" y="188" font-size="10.5" letter-spacing="1" text-anchor="middle">running the studio</text>
  </g>
  <g class="m m9">
    <circle cx="1152" cy="125" r="3" fill="var(--dim)"/>
    <text fill="var(--dim)" class="mono" x="1152" y="105" font-size="10" letter-spacing="2" text-anchor="end">2027 &#8594;</text>
    <text fill="var(--dim)" class="mono" x="1152" y="88" font-size="13" text-anchor="end">the interesting part</text>
  </g>
</svg>
