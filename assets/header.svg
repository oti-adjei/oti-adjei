<svg viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="George Heavenson — Software Engineer, Mobile and Web">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(12px); } to { opacity:1;transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.2s} .a2{animation-delay:.5s} .a3{animation-delay:.9s} .a4{animation-delay:1.2s} .a5{animation-delay:1.4s} .a6{animation-delay:1.7s}
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.fade { animation: none; }
      .draw{stroke-dashoffset:0} .rise,.fade{opacity:1}
    }
    :root { --bone:#0A0A0A; --muted:#6E6E6E; --dim:#9A9A9A; --rule:#D8D8D8; --accent:#0A0A0A; --ghost:#EBEBEB; --node-bg:#FFFFFF; --core-bg:#F4F4F4; --ink:#0A0A0A; --paper:#FFFFFF; }
  </style>

  <line class="draw a1" x1="48" y1="58" x2="952" y2="58" stroke="var(--rule)" stroke-width="1"/>
  <g class="fade a1">
    <text class="mono" fill="var(--muted)" x="48" y="44" font-size="11" letter-spacing="3.5">PROFILE — INDEX N&#186; 001</text>
    <text class="mono" fill="var(--muted)" x="952" y="44" font-size="11" letter-spacing="3.5" text-anchor="end">ACCRA, GH — 5.60&#176; N</text>
  </g>

  <g class="rise a2">
    <text fill="var(--bone)" class="mono" x="46" y="176" font-size="72" letter-spacing="-2">George Heavenson</text>
  </g>
  <g class="fade a3">
    <text fill="var(--muted)" class="mono" x="48" y="214" font-size="19">Software Engineer &#183; Founder, Senvon Atelier. Accra, Ghana.</text>
  </g>

  <g class="fade a4">
    <text fill="var(--dim)" class="mono" x="48" y="274" font-size="12.5" letter-spacing="1">focus  &#9656;</text>
    <text fill="var(--accent)" class="mono" x="128" y="274" font-size="12.5" letter-spacing="1">TypeScript &amp; Go services &#183; Astro storefronts &#183; Flutter apps &#183; developer tooling</text>
  </g>
  <g class="fade a5">
    <text fill="var(--dim)" class="mono" x="48" y="300" font-size="12.5" letter-spacing="1">running a digital studio at senvon.studio &#183; building in public &#183; streaming on twitch</text>
  </g>

  <line class="draw a5" x1="48" y1="342" x2="952" y2="342" stroke="var(--rule)" stroke-width="1"/>
  <g class="fade a6">
    <text fill="var(--muted)" class="mono" x="48" y="374" font-size="11.5" letter-spacing="3">TYPESCRIPT &amp; GO</text>
    <text fill="var(--accent)" class="mono" x="240" y="374" font-size="11.5">&#183;</text>
    <text fill="var(--muted)" class="mono" x="290" y="374" font-size="11.5" letter-spacing="3">ASTRO &amp; HONO</text>
    <text fill="var(--accent)" class="mono" x="454" y="374" font-size="11.5">&#183;</text>
    <text fill="var(--muted)" class="mono" x="505" y="374" font-size="11.5" letter-spacing="2.5">FLUTTER &amp; CLI</text>
    <text fill="var(--muted)" class="mono" x="952" y="374" font-size="11.5" letter-spacing="3" text-anchor="end">SHIPPING SINCE 2019</text>
  </g>
</svg>
