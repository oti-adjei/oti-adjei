<svg viewBox="0 0 1000 370" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Track record — independent client work, freelance product builds, ALX software engineering, university computer science">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s} .a4{animation-delay:.75s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
    :root { --bone:#0A0A0A; --muted:#6E6E6E; --dim:#9A9A9A; --rule:#D8D8D8; --accent:#0A0A0A; --ghost:#EBEBEB; --node-bg:#FFFFFF; --core-bg:#F4F4F4; --ink:#0A0A0A; --paper:#FFFFFF; }
  </style>

  <line x1="120" y1="10" x2="120" y2="360" stroke="var(--rule)" stroke-width="1" opacity=".4"/>

  <g class="rise a1">
    <text class="mono" x="48" y="42"  font-size="12" fill="var(--accent)" letter-spacing="2">2026</text>
    <text class="mono" x="136" y="42"  font-size="15" fill="var(--bone)">Independent &#183; Software Engineer &#183; Accra, Ghana</text>
    <text class="mono" x="136" y="68"  font-size="14" fill="var(--muted)">client web and mobile builds end to end &#8212; design handoff through deploy</text>
    <text class="mono" x="136" y="90"  font-size="14" fill="var(--muted)">building developer tooling in the open and streaming the work on Twitch</text>
  </g>

  <g class="rise a2">
    <text class="mono" x="48" y="138" font-size="12" fill="var(--accent)" letter-spacing="2">2025</text>
    <text class="mono" x="136" y="138" font-size="15" fill="var(--bone)">Freelance product work &#183; e-commerce, billing, healthcare</text>
    <text class="mono" x="136" y="164" font-size="14" fill="var(--muted)">Nawura Angyique boutique storefront on a Strapi backend &#183; payQuill invoicing</text>
    <text class="mono" x="136" y="186" font-size="14" fill="var(--muted)">aether-care healthcare API &#183; Arkyt scaffolding CLI released in Go</text>
  </g>

  <g class="rise a3">
    <text class="mono" x="48" y="234" font-size="12" fill="var(--accent)" letter-spacing="1">2023&#8211;24</text>
    <text class="mono" x="136" y="234" font-size="15" fill="var(--bone)">ALX Software Engineering &#183; Full-Stack Track</text>
    <text class="mono" x="136" y="260" font-size="14" fill="var(--muted)">C fundamentals &#8212; shell reimplementation, printf clone, bytecode interpreter</text>
    <text class="mono" x="136" y="282" font-size="14" fill="var(--muted)">Python, Linux and DevOps coursework &#183; AirBnB clone team project</text>
  </g>

  <g class="rise a4">
    <text class="mono" x="48" y="330" font-size="12" fill="var(--accent)" letter-spacing="1">2019&#8211;22</text>
    <text class="mono" x="136" y="330" font-size="15" fill="var(--bone)">University Computer Science &#183; Mobile &amp; Web Track</text>
    <text class="mono" x="136" y="356" font-size="14" fill="var(--muted)">CovidApp final-year project &#183; BloodSpot donation app with a PHP admin panel</text>
  </g>
</svg>
